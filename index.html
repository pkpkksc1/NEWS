<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>바이두 TOP10 중국어 학습</title>

  <link rel="stylesheet" href="./style.css">
</head>

<body>
  <header class="header">
    <div class="header-inner">
      <p class="header-label">百度热搜 TOP 10</p>

      <h1>바이두 실시간 중국어</h1>

      <p class="header-description">
        중국어 원문 · 병음 · 해석 · 요약 · 전체 단어
      </p>

      <div class="update-box">
        <span>업데이트</span>
        <strong id="updatedAt">확인 중</strong>
      </div>
    </div>
  </header>

  <main class="container">
    <section id="dailyDashboard" class="daily-dashboard" aria-live="polite">
      <p class="loading-message">오늘의 학습 카드를 불러오는 중입니다.</p>
    </section>

    <section class="news-section-heading">
      <p class="section-eyebrow">百度热搜 TOP 10</p>
      <h2>오늘의 뉴스</h2>
      <p>기존 뉴스 학습 자료는 아래에서 그대로 확인할 수 있습니다.</p>
    </section>

    <section class="control-panel">
      <label for="searchInput">검색</label>

      <input
        type="search"
        id="searchInput"
        placeholder="중국어, 병음 또는 한국어 검색"
        autocomplete="off"
      >

      <button
        type="button"
        id="refreshButton"
        class="primary-button"
      >
        새로고침
      </button>
    </section>

    <section class="information">
      <div>
        <span>뉴스</span>
        <strong id="newsCount">0개</strong>
      </div>

      <p>바이두 실시간 인기 검색어를 학습용으로 정리했습니다.</p>
    </section>

    <section
      id="newsList"
      class="news-list"
      aria-live="polite"
    >
      <p class="loading-message">
        데이터를 불러오는 중입니다.
      </p>
    </section>
  </main>

  <footer>
    <p>중국어 학습용 자동 정리 페이지입니다.</p>
  </footer>

  <script src="./script.js"></script>
</body>
</html>
